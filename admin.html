<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Home Mess Manager V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Top Header with Notification Bell -->
    <header class="top-header" style="display: flex; justify-content: space-between; align-items: center; position: relative;">
      <h2>👑 Admin Panel (Rizu)</h2>
      
      <!-- Notification Bell Icon -->
      <div class="notification-wrapper" style="position: relative; display: inline-block; margin-left: auto; margin-right: 10px;">
        <button id="bell-icon-btn" class="btn btn-light" style="background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 50%; cursor: pointer; font-size: 1rem; position: relative;">
          🔔 
          <span id="notif-badge" class="badge" style="position: absolute; top: -2px; right: -2px; background: #dc2626; color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 50%; display: none;">0</span>
        </button>
        <div id="notif-dropdown" class="card shadow" style="display: none; position: absolute; right: 0; top: 40px; width: 280px; max-height: 320px; overflow-y: auto; z-index: 1000; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <div style="font-weight: bold; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin-bottom: 5px; font-size: 0.9rem; color: #1e293b;">Notifications</div>
          <div id="notification-list">
            <small style="color: #64748b;">No new notifications.</small>
          </div>
        </div>
      </div>

      <a href="history.html" class="nav-link" style="margin-right: 10px;">📜 History</a>
      <button id="logout-btn" class="btn-logout">Logout</button>
    </header>

    <!-- Pending Requests Approval Card -->
    <div class="card" style="border: 1px solid #f59e0b; background: #fffbeb;">
      <h3 style="color: #b45309; display: flex; justify-content: space-between; align-items: center;">
        <span>⏳ Pending Approvals</span>
        <span id="pending-count" style="background: #d97706; color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px;">0</span>
      </h3>
      <div id="approval-list">
        <p style="color: #64748b; font-size: 0.85rem;">No pending requests at the moment.</p>
      </div>
    </div>

    <!-- Bazar Cost Entry Card -->
    <div class="card">
      <h3>🛒 Record Daily Bazar Expense</h3>
      <form id="bazar-form">
        <div class="form-group">
          <label for="bazar-date">Select Date</label>
          <input type="date" id="bazar-date" required>
        </div>
        <div class="form-group">
          <label for="bazar-item">Item Name</label>
          <input type="text" id="bazar-item" placeholder="e.g. Rice, Fish, Oil" required>
        </div>
        <div class="form-group">
          <label for="bazar-amount">Amount (Tk)</label>
          <input type="number" id="bazar-amount" placeholder="e.g. 500" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Bazar Expense</button>
      </form>
    </div>

    <!-- Direct Deposit Entry Card for Admin -->
    <div class="card">
      <h3>💵 Add Direct Deposit Entry</h3>
      <form id="admin-deposit-form">
        <div class="form-group">
          <label for="admin-deposit-user">Select Member</label>
          <select id="admin-deposit-user" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1;">
            <option value="" disabled selected>-- Select Member --</option>
            <option value="Jim">Jim</option>
            <option value="Maruf">Maruf</option>
            <option value="Arafat">Arafat</option>
            <option value="Shawon">Shawon</option>
            <option value="Tanvir">Tanvir</option>
            <option value="Sourov">Sourov</option>
            <option value="Rizu">Rizu</option>
          </select>
        </div>
        <div class="form-group">
          <label for="admin-deposit-amount">Amount (Tk)</label>
          <input type="number" id="admin-deposit-amount" placeholder="Enter Amount" required>
        </div>
        <button type="submit" class="btn btn-secondary">Add Deposit</button>
      </form>
    </div>

    <!-- Change Admin PIN -->
    <div class="card">
      <h3>🔑 Change Admin PIN</h3>
      <div class="form-group">
        <input type="password" id="new-admin-pin-input" placeholder="New Admin PIN (min 4 digits)">
      </div>
      <button id="update-admin-pin-btn" class="btn btn-secondary">Update Admin PIN</button>
      <p id="admin-pin-msg" class="status-msg"></p>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
