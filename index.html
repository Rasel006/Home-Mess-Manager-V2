<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Mess Manager V2 - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>🏠 Home Mess Manager</h2>
      <p class="subtitle" style="font-size: 0.88rem; color: #64748b; text-align: center; margin-bottom: 24px;">Select your account to continue</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="user-select">Select Member</label>
          <select id="user-select" required>
            <option value="" disabled selected>-- Select Name --</option>
            <option value="Rizu" data-role="admin">👑 Rizu (Admin)</option>
            <option value="Jim" data-role="member">Jim</option>
            <option value="Maruf" data-role="member">Maruf</option>
            <option value="Arafat" data-role="member">Arafat</option>
            <option value="Shawon" data-role="member">Shawon</option>
            <option value="Tanvir" data-role="member">Tanvir</option>
            <option value="Sourov" data-role="member">Sourov</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pin-input">Enter PIN</label>
          <input type="password" id="pin-input" placeholder="Enter PIN (Default: 1234)" required />
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
          <input type="checkbox" id="remember-me" checked style="width: auto; cursor: pointer;">
          <label for="remember-me" style="font-size: 0.85rem; cursor: pointer; margin-bottom: 0; font-weight: 500;">Remember Me (Stay Logged In)</label>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>
      <p id="error-msg" class="error-text" style="color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 14px;"></p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
