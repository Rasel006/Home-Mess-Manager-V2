<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily History - Home Mess Manager V2</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .history-card {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
    }
    .date-select-box {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      outline: none;
    }
    .back-btn {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Top Header -->
    <header class="top-header" style="display: flex; justify-content: space-between; align-items: center; position: relative;">
      <h2>📜 Daily History</h2>

      <!-- Notification Bell Icon -->
      <div class="notification-wrapper" style="position: relative; display: inline-block; margin-left: auto; margin-right: 10px;">
        <button id="bell-icon-btn" class="btn btn-light" style="background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 50%; cursor: pointer; font-size: 1rem; position: relative;">
          🔔 
          <span id="notif-badge" class="badge" style="position: absolute; top: -2px; right: -2px; background: #dc2626; color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 50%; display: none;">0</span>
        </button>
        <div id="notif-dropdown" class="card shadow" style="display: none; position: absolute; right: 0; top: 40px; width: 280px; max-height: 320px; overflow-y: auto; z-index: 1000; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <div style="font-weight: bold; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin-bottom: 5px; font-size: 0.9rem; color: #1e293b;">Notifications</div>
          <div id="notification-list">
            <small style="color: #64748b;">No new notifications.</small>
          </div>
        </div>
      </div>

      <a href="#" id="back-btn" class="back-btn">← Back</a>
    </header>

    <!-- Select Date Card -->
    <div class="history-card">
      <label for="history-date-select" style="font-weight: 600; display: block; margin-bottom: 8px; color: #334155;">
        Select Date:
      </label>
      <select id="history-date-select" class="date-select-box">
        <option value="">Loading dates...</option>
      </select>
    </div>

    <!-- History Data Board -->
    <div class="history-card">
      <h3 style="margin-bottom: 12px; color: #1e293b;">
        Meals on <span id="selected-date-label" style="color: #2563eb;">--</span>
      </h3>

      <table class="meal-table">
        <thead>
          <tr>
            <th>Member</th>
            <th>Lunch</th>
            <th>Dinner</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="history-board-body">
          <tr>
            <td colspan="4" style="text-align: center; color: #64748b;">Loading history...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- History Bazar Expense Card -->
    <div class="history-card">
      <h3 style="margin-bottom: 10px; color: #1e293b;">🛒 Bazar Expenses on Date</h3>
      <ul id="history-bazar-list" style="list-style: none; padding: 0; margin: 0; font-size: 0.9rem; color: #475569;">
        <li>Loading expenses...</li>
      </ul>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
