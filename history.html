<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily History - Home Mess Manager V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    
    <header class="top-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>📜 Daily History</h2>
      <a id="back-btn" href="#" class="nav-link">← Back</a>
    </header>

    <!-- Date Picker Card -->
    <div class="card">
      <label for="history-date" style="font-weight: 600; display: block; margin-bottom: 8px;">Select Date:</label>
      <input type="date" id="history-date" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 1rem;">
    </div>

    <!-- History Table Card -->
    <div class="card">
      <h3>Meals on <span id="selected-history-date">--</span></h3>
      <table class="meal-table">
        <thead>
          <tr>
            <th>Member</th>
            <th>Lunch</th>
            <th>Dinner</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="history-board-body">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
