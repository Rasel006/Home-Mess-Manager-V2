<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal History - Home Mess Manager V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    
    <header class="top-header">
      <h2>📜 Daily History</h2>
      <a href="admin.html" class="nav-link">⬅ Back to Admin</a>
    </header>

    <!-- Phase 7: History Query -->
    <div class="card">
      <div class="form-group">
        <label for="history-date">Select Date:</label>
        <input type="date" id="history-date" />
      </div>
    </div>

    <div class="card">
      <h3>Meals on <span id="selected-history-date">--</span></h3>
      <table class="meal-table">
        <thead>
          <tr>
            <th>Member</th>
            <th>Lunch</th>
            <th>Dinner</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="history-board-body">
          <tr><td colspan="4">Choose a date above.</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
