<!-- Member Meal Entry Card -->
<div class="card">
  <h3>🍽️ Your Today's Meal (<span id="current-date">--</span>)</h3>
  <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 12px;">
    ⏰ Cutoffs: Lunch before 12:00 PM | Dinner before 8:00 PM
  </p>

  <div class="meal-input-group">
    <div class="meal-row">
      <span>Lunch Meal:</span>
      <div class="counter-control">
        <button type="button" class="btn-counter" id="lunch-minus">-</button>
        <span id="lunch-val" class="counter-val">0</span>
        <button type="button" class="btn-counter" id="lunch-plus">+</button>
      </div>
    </div>

    <div class="meal-row">
      <span>Dinner Meal:</span>
      <div class="counter-control">
        <button type="button" class="btn-counter" id="dinner-minus">-</button>
        <span id="dinner-val" class="counter-val">0</span>
        <button type="button" class="btn-counter" id="dinner-plus">+</button>
      </div>
    </div>
  </div>

  <!-- Save & Edit Button Section -->
  <div style="display: flex; gap: 10px; margin-top: 15px;">
    <button id="save-meal-btn" class="btn btn-primary" style="flex: 1;">Save Meal</button>
    <button id="edit-meal-btn" class="btn btn-secondary" style="display: none; width: auto; padding: 0 16px;">✏️ Edit</button>
  </div>
  <p id="save-msg" class="status-msg"></p>
</div>
