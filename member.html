<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Dashboard - Home Mess Manager V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    
    <header class="top-header">
      <h2 id="welcome-name">Hi, Member! 👋</h2>
      <button id="logout-btn" class="btn-logout">Logout</button>
    </header>

    <!-- Phase 6: Member Cooking Summary -->
    <div class="card summary-card">
      <h3>🍛 Today's Cooking Summary</h3>
      <div class="summary-grid">
        <div class="summary-box">
          <span class="label">Lunch</span>
          <span id="total-lunch" class="count">0</span>
        </div>
        <div class="summary-box">
          <span class="label">Dinner</span>
          <span id="total-dinner" class="count">0</span>
        </div>
        <div class="summary-box total-box">
          <span class="label">Total</span>
          <span id="total-day" class="count">0</span>
        </div>
      </div>
    </div>

    <!-- Phase 4: Today's Meal Entry -->
    <div class="card">
      <h3>📅 Today: <span id="current-date">--</span></h3>
      
      <div class="meal-input-group">
        <div class="meal-row">
          <span>Lunch Meal:</span>
          <div class="counter-control">
            <button type="button" class="btn-counter" id="lunch-minus">-</button>
            <span id="lunch-val" class="counter-val">0</span>
            <button type="button" class="btn-counter" id="lunch-plus">+</button>
          </div>
        </div>

        <div class="meal-row">
          <span>Dinner Meal:</span>
          <div class="counter-control">
            <button type="button" class="btn-counter" id="dinner-minus">-</button>
            <span id="dinner-val" class="counter-val">0</span>
            <button type="button" class="btn-counter" id="dinner-plus">+</button>
          </div>
        </div>
      </div>

      <button id="save-meal-btn" class="btn btn-primary">Save Meal</button>
      <p id="save-msg" class="status-msg"></p>
    </div>

    <!-- Phase 5: Live Real-Time Board -->
    <div class="card">
      <h3>📋 Today's Meal Board</h3>
      <table class="meal-table">
        <thead>
          <tr>
            <th>Member</th>
            <th>Lunch</th>
            <th>Dinner</th>
          </tr>
        </thead>
        <tbody id="board-body">
          <tr><td colspan="3">Loading board...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Security: Update PIN -->
    <div class="card">
      <h3>🔑 Security Settings</h3>
      <div class="form-group">
        <label for="new-pin-input">Change PIN</label>
        <input type="password" id="new-pin-input" placeholder="Enter new PIN" maxLength="6" />
      </div>
      <button id="update-pin-btn" class="btn btn-secondary">Update PIN</button>
      <p id="pin-msg" class="status-msg"></p>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
